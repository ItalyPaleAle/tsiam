name: Vulnerability scan

on:
  push:
    branches:
      - main
      - v*
  pull_request:
    branches:
      - main
      - v*
  # New advisories are published without any change to this repo, so re-scan on a schedule too
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # Release binaries link different modules per OS, so each target OS is scanned separately
      # govulncheck exits non-zero only when vulnerable code is actually reachable from tsiam
      - name: Run govulncheck
        run: |
          make vulncheck
