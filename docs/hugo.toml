# Generated by vercel-docs-build from config.json — do not edit by hand.
baseURL = "https://tsiam.italypaleale.me/"
locale = "en-us"
title = "tsiam"
disableKinds = ["rss"]
enableRobotsTXT = true

[module]
  [module.hugoVersion]
    extended = true
    min = '0.164.0'
  [[module.imports]]
    path = "github.com/italypaleale/hugo-assets"

# Required for render hooks + unsafe HTML in markdown
[markup]
  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false
    lineNumbersInTable = false
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "Workload Identity over Tailscale"
  github_url = "https://github.com/italypaleale/tsiam"
  github_repo = "https://github.com/italypaleale/tsiam"
  github_branch = "main"
  PlausibleAnalytics = true

  [params.robots]
    llmsTXT = true

  [params.theme]
    scheme = "slate"
    icon_light = "icon-light.svg"
    icon_dark = "icon-dark.svg"
    favicon = "favicon-light.svg"

# Taxonomy pages aren't needed for a docs site
[taxonomies]

# Output HTML and Markdown for AI agents
[outputs]
  home    = ["html", "markdown"]
  section = ["html", "markdown"]
  page    = ["html", "markdown"]
