baseURL = "https://tsiam.italypaleale.me/"
locale = "en-us"
title = "tsiam"
disableKinds = ["rss", "taxonomy", "term"]

[module]
  [[module.imports]]
    path = "github.com/italypaleale/hugo-assets"

# Required for render hooks + unsafe HTML in markdown
[markup]
  [markup.highlight]
    # Use CSS classes styled by main.css Chroma rules
    noClasses = false
    # Fallback only; noClasses = false overrides this
    style = "github"
    lineNos = false
    lineNumbersInTable = false
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Allow raw HTML in markdown content
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description        = "Workload Identity over Tailscale"
  github_url         = "https://github.com/italypaleale/tsiam"
  github_repo        = "https://github.com/italypaleale/tsiam"
  github_branch      = "main"
  PlausibleAnalytics = true

  [params.theme]
    scheme = "slate"
    icon_light = "icon-light.svg"
    icon_dark = "icon-dark.svg"
    favicon = "favicon-light.svg"

# Taxonomy pages aren't needed for a docs site
[taxonomies]
