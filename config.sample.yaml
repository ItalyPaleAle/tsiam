tsnet:
  ## tsnet.hostname (string)
  ## Description:
  ##   Hostname to use for the tsnet node.
  ## Default: "tsiam"
  #hostname: "tsiam"

  ## tsnet.authKey (string)
  ## Description:
  ##   AuthKey can be used to authenticate the tsnet node automatically.
  ##   If empty, tsnet will rely on existing state in the database.
  #authKey: ""

  ## tsnet.clientId (string)
  ## Description:
  ##   ClientID to use for the tsnet node.
  ##   Takes priority over TS_CLIENT_ID.
  ##   Optional query attributes can be appended, e.g. `?ephemeral=false&preauthorized=true` - without them the generated auth key is ephemeral.
  ##   If empty, not used
  #clientId: ""

  ## tsnet.idToken (string)
  ## Description:
  ##   IDToken to use for workload identity federation into the tailnet.
  ##   Takes priority over TS_ID_TOKEN
  ##   If empty, not used
  #idToken: ""

  ## tsnet.idTokenFile (string)
  ## Description:
  ##   IDTokenFile reads the IDToken from a file to use for workload identity federation into the tailnet.
  ##   Takes priority over TS_ID_TOKEN
  ##   If empty, not used
  #idTokenFile: ""

  ## tsnet.audience (string)
  ## Description:
  ##   Audience to use for workload identity federation into the tailnet
  ##   Takes priority over TS_AUDIENCE
  ##   If empty, not used
  #audience: ""

  ## tsnet.stateDir (string)
  ## Description:
  ##   Directory where tsnet stores its state.
  ##   If empty, defaults to a folder next to the loaded config file.
  #stateDir: ""

  ## tsnet.ephemeral (boolean)
  ## Description:
  ##   If true, the tsnet node is ephemeral (not persisted in the tailnet).
  ## Default: false
  #ephemeral: false

  ## tsnet.advertiseTags (list of strings)
  ## Description:
  ##   Tags that should be applied to this node in the tailnet, for purposes of ACL enforcement.
  ##   These can be referenced from the ACL policy document.
  ##   Tags are generally required when using OAuth2 or workload identity federation to authenticate the node.
  #advertiseTags: []

  ## tsnet.funnel (boolean)
  ## Description:
  ##   If true, enables Tailscale Funnel to expose the .well-known endpoints publicly.
  ##   This allows external OIDC clients to discover the JWKS without being on the tailnet.
  ##   Note: see requirements for enabling Tailscale Funnel: https://tailscale.com/kb/1223/funnel
  ## Default: false
  #funnel: false

logs:
  ## logs.level (string)
  ## Description:
  ##   Controls log level and verbosity.
  ##   Supported values: `debug`, `info` (default), `warn`, `error`.
  ## Default: "info"
  #level: "info"

  ## logs.omitHealthChecks (boolean)
  ## Description:
  ##   If true, calls to the healthcheck endpoint (`/healthz`) are not included in the logs.
  ## Default: true
  #omitHealthChecks: true

  ## logs.json (boolean)
  ## Description:
  ##   If true, emits logs formatted as JSON, otherwise uses a text-based structured log format.
  ##   Defaults to false if a TTY is attached (e.g. when running the binary directly in the terminal or in development), true otherwise (e.g. in containers).
  #json: false

metrics:
  ## metrics.includeNodeName (boolean)
  ## Description:
  ##   If true, add the caller's node name (`node` attribute) to the `tsiam_auths` metric.
  ##   Avoid enabling this with ephemeral nodes, as each node name creates a new time series.
  ## Default: false
  #includeNodeName: false

tokens:
  ## tokens.lifetime (duration)
  ## Description:
  ##   Token life time, as a Go duration
  ##   Must be between 1 and 60 minutes
  ## Default: "5m"
  #lifetime: "5m"

  ## tokens.allowedAudiences (list of strings)
  ## Description:
  ##   Allowed audiences (aud claim values) for JWT tokens
  ##   Only audiences listed here can be requested by clients
  ##
  ##   Examples:
  ##   - AWS: `sts.amazonaws.com` (for OIDC federation with AWS IAM)
  ##   - Microsoft Entra ID (Azure AD): `api://AzureADTokenExchange` (for Workload Identity Federation)
  ##   - Google Cloud: Your workload identity pool audience (e.g., `//iam.googleapis.com/projects/PROJECT_ID/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID`)
  ##   - Custom APIs: Use your API's identifier (e.g., `https://api.example.com`)
  ## Required
  allowedAudiences: []

  ## tokens.allowEmptyNodeCapability (boolean)
  ## Description:
  ##   If true, allows nodes without the audience capability to request any globally-allowed audience
  ##   If false (default), all nodes must have the capability explicitly granted
  ## Default: false
  #allowEmptyNodeCapability: false

  ## tokens.rateLimitPerMinute (number)
  ## Description:
  ##   Maximum number of `/token` requests per minute per client IP (0 to disable)
  ## Default: 60
  #rateLimitPerMinute: 60

  ## tokens.subjectClaim (string)
  ## Description:
  ##   Value to use for the JWT `sub` claim
  ##   Allowed values:
  ##     - "nodeId" (default, recommended): stable Tailscale node ID
  ##     - "name": MagicDNS node name (can be reused if a device is removed and re-created)
  ##     - "capability": `subject` field from matching Tailscale ACL grants, falling back to the node ID if no matching grant sets `subject`
  ## Default: "nodeId"
  #subjectClaim: "nodeId"

  ## tokens.claimName (string)
  ## Description:
  ##   Name of the custom JWT claim with the caller's Tailscale identity
  ##   Note: Tailscale ACL grants always use `italypaleale.me/tsiam` regardless of this setting
  ## Default: "italypaleale.me/tsiam"
  #claimName: "italypaleale.me/tsiam"

  ## tokens.includeCapabilities (boolean)
  ## Description:
  ##   If true, include the caller's tsiam capability grants under `capMap` in the identity claim
  ## Default: false
  #includeCapabilities: false

signingKey:
  ## signingKey.storage (string)
  ## Description:
  ##   Key storage provider
  ##   Allowed values: "file" (default), "memory", "AzureKeyVaultKeys", "AzureKeyVaultSecrets"
  ## Default: "file"
  #storage: "file"

  ## signingKey.algorithm (string)
  ## Description:
  ##   Signing algorithm to use.
  ##   Supported values: RS256, ES256, ES384, ES512, EdDSA.
  ##   Changing this does not replace an existing key.
  ## Default: "ES256"
  #algorithm: "ES256"

  ## signingKey.curve (string)
  ## Description:
  ##   Curve for EdDSA algorithm.
  ##   Currently only Ed25519 is supported.
  #curve: ""

  ## signingKey.file
  ## Description:
  ##   Options for the "file" key storage
  file:
    ## signingKey.file.storagePath (string)
    ## Description:
    ##   StoragePath is the path to store signing key on disk.
    ##   The key is not encrypted on disk.
    ## Required
    storagePath: ""

  ## signingKey.azureKeyVaultKeys
  ## Description:
  ##   Options for the "AzureKeyVaultKeys" key storage
  azureKeyVaultKeys:
    ## signingKey.azureKeyVaultKeys.vaultUrl (string)
    ## Description:
    ##   VaultURL is the URL of the Azure Key Vault (e.g., https://myvault.vault.azure.net/).
    ## Required
    vaultUrl: ""

    ## signingKey.azureKeyVaultKeys.keyName (string)
    ## Description:
    ##   KeyName is the name of the key in Azure Key Vault used for wrapping/unwrapping.
    ##   The key is unwrapped using Azure Key Vault on app startup.
    ## Required
    keyName: ""

    ## signingKey.azureKeyVaultKeys.keyVersion (string)
    ## Description:
    ##   KeyVersion is the version of the key in Azure Key Vault used to wrap new signing keys.
    ##   If empty or "latest", the latest version of the key is used.
    #keyVersion: ""

    ## signingKey.azureKeyVaultKeys.storagePath (string)
    ## Description:
    ##   StoragePath is the path to store the wrapped signing key on disk.
    ## Required
    storagePath: ""

    ## signingKey.azureKeyVaultKeys.tenantId (string)
    ## Description:
    ##   TenantID is the Microsoft Entra ID tenant ID for authentication.
    ##   Required when `clientSecret` is set.
    #tenantId: ""

    ## signingKey.azureKeyVaultKeys.clientId (string)
    ## Description:
    ##   ClientID is the Microsoft Entra ID application (client) ID or user-assigned managed identity client ID for authentication.
    ##   Required when `clientSecret` is set.
    ##   If `clientId` and `clientSecret` are both empty, DefaultAzureCredential is used.
    #clientId: ""

    ## signingKey.azureKeyVaultKeys.clientSecret (string)
    ## Description:
    ##   ClientSecret is the Microsoft Entra ID application client secret for authentication.
    ##   Requires `tenantId` and `clientId`.
    #clientSecret: ""

  ## signingKey.azureKeyVaultSecrets
  ## Description:
  ##   Options for the "AzureKeyVaultSecrets" key storage
  azureKeyVaultSecrets:
    ## signingKey.azureKeyVaultSecrets.vaultUrl (string)
    ## Description:
    ##   VaultURL is the URL of the Azure Key Vault (e.g., https://myvault.vault.azure.net/).
    ## Required
    vaultUrl: ""

    ## signingKey.azureKeyVaultSecrets.secretName (string)
    ## Description:
    ##   SecretName is the name of the secret in Azure Key Vault that stores the signing key.
    ##   The entire key is stored in Azure Key Vault.
    ## Required
    secretName: ""

    ## signingKey.azureKeyVaultSecrets.tenantId (string)
    ## Description:
    ##   TenantID is the Microsoft Entra ID tenant ID for authentication.
    ##   Required when `clientSecret` is set.
    #tenantId: ""

    ## signingKey.azureKeyVaultSecrets.clientId (string)
    ## Description:
    ##   ClientID is the Microsoft Entra ID application (client) ID or user-assigned managed identity client ID for authentication.
    ##   Required when `clientSecret` is set.
    ##   If `clientId` and `clientSecret` are both empty, DefaultAzureCredential is used.
    #clientId: ""

    ## signingKey.azureKeyVaultSecrets.clientSecret (string)
    ## Description:
    ##   ClientSecret is the Microsoft Entra ID application client secret for authentication.
    ##   Requires `tenantId` and `clientId`.
    #clientSecret: ""

